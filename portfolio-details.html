<script>

    },

      description: "A company gathering that brings employees and their families together in a relaxed and enjoyable environment. This activity aims to strengthen relationships, create memorable experiences, and build a stronger sense of belonging within the company."

  ];

 
window.addEventListener("load", function () {

    // Mengambil elemen slider
    const sliderElement = document.querySelector(
        ".portfolio-details-slider"
    );

    if (!sliderElement || !sliderElement.swiper) {
        console.error("Swiper belum berhasil diinisialisasi.");
        return;
    }

    // Mengambil Swiper
    const swiper = sliderElement.swiper;

    // Mengambil ID dari URL
    const params = new URLSearchParams(window.location.search);
    const selectedId = Number(params.get("id") || 0);

    // Memastikan ID sesuai dengan jumlah data
    const initialIndex =
        selectedId >= 0 && selectedId < detailData.length
            ? selectedId
            : 0;

    // Menampilkan gambar sesuai ID yang diklik
    swiper.slideToLoop(initialIndex, 0);

    // Memperbarui informasi detail
    function updateDetail() {

        const index = swiper.realIndex;
        const detail = detailData[index];

        if (!detail) return;

        document.getElementById("detail-title").textContent =
            detail.title;

        document.getElementById("detail-category").textContent =
            detail.category;

        document.getElementById("detail-number").textContent =
            (index + 1) + " of " + detailData.length;

        document.getElementById("detail-heading").textContent =
            detail.title;

        document.getElementById("detail-description").textContent =
            detail.description;
    }

    // Memperbarui informasi ketika gambar slider berubah
    swiper.on("slideChange", updateDetail);

    // Menampilkan informasi awal
    updateDetail();

});
</script>
